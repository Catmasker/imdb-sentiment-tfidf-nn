name: Train and Upload to Hugging Face

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
      import os, json
      from huggingface_hub import HfApi

      token = os.environ['HF_TOKEN']
      api = HfApi()
      who = api.whoami(token=token)
      HF_USERNAME = who['name']
      REPO_NAME = 'imdb-sentiment-tfidf-nn'

      repo_id = f'{HF_USERNAME}/{REPO_NAME}'
      api.create_repo(repo_id, token=token, exist_ok=True, private=False)
      print(f'HF Repo: https://huggingface.co/{repo_id}')

      artifacts = [
          'model/model.pt',
          'model/config.json',
          'model/metrics.json',
          'model/tfidf_vectorizer.pkl',
      ]

      for fpath in artifacts:
          if os.path.exists(fpath):
              api.upload_file(
                  path_or_fileobj=fpath,
                  path_in_repo=fpath,
                  repo_id=repo_id,
                  token=token,
              )
              print(f'Uploaded {fpath}')

      print(f'All files uploaded to https://huggingface.co/{repo_id}')
      "
