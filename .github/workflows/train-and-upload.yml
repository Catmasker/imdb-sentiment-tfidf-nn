name: Train and Upload to Hugging Face

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # 允许手动触发

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
import os, json
from huggingface_hub import HfApi

token = os.environ['HF_TOKEN']
HF_USERNAME = os.environ.get('HF_USERNAME', '')  # 你的 HF 用户名
REPO_NAME = 'imdb-sentiment-glove-nn'

# 如果是第一次运行，把下面这行的 HF_USERNAME 改为你的实际用户名
if not HF_USERNAME:
    # 尝试从 token 获取用户名
    api_test = HfApi()
    try:
        who = api_test.whoami(token=token)
        HF_USERNAME = who['name']
    except:
        HF_USERNAME = 'YOUR_HF_USERNAME'

repo_id = f'{HF_USERNAME}/{REPO_NAME}'
api = HfApi()

# 创建或获取 Hugging Face 仓库
api.create_repo(repo_id, token=token, exist_ok=True, private=False)
print(f'HF Repo: https://huggingface.co/{repo_id}')

# 上传所有训练产物
artifacts = [
    'model/model.pt',
    'model/config.json',
    'model/metrics.json',
    'model/glove_embedding.pkl',
]

for fpath in artifacts:
    if os.path.exists(fpath):
        api.upload_file(
            path_or_fileobj=fpath,
            path_in_repo=fpath,
            repo_id=repo_id,
            token=token,
        )
        print(f'Uploaded {fpath}')

print(f'✅ All files uploaded to https://huggingface.co/{repo_id}')
"
